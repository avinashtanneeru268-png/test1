<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium Neon Red & Crimson Gradients -->
    <linearGradient id="bunny-crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4770" />
      <stop offset="50%" stop-color="#ff2a55" />
      <stop offset="100%" stop-color="#990f2b" />
    </linearGradient>

    <linearGradient id="bunny-ear-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3d030f" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="bunny-dark-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="bunny-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Cyber Shield / Hex Aura -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" 
           fill="#0d0d12" 
           stroke="url(#bunny-crimson-grad)" 
           stroke-width="2.5" 
           stroke-opacity="0.4" />

  <!-- Outer Ears -->
  <!-- Left Ear -->
  <path d="M33 14 C27 24 26 40 34 52 L42 49 C36 38 37 26 42 16 C38 13 35 13 33 14 Z" 
        fill="url(#bunny-dark-armor)" 
        stroke="url(#bunny-crimson-grad)" 
        stroke-width="2" />
  <!-- Left Ear Inner Glow -->
  <path d="M35 22 C31 30 31 40 37 47 L39 46 C34 38 35 30 38 23 Z" 
        fill="url(#bunny-ear-inner)" 
        filter="url(#bunny-neon-glow)" />

  <!-- Right Ear -->
  <path d="M67 14 C73 24 74 40 66 52 L58 49 C64 38 63 26 58 16 C62 13 65 13 67 14 Z" 
        fill="url(#bunny-dark-armor)" 
        stroke="url(#bunny-crimson-grad)" 
        stroke-width="2" />
  <!-- Right Ear Inner Glow -->
  <path d="M65 22 C69 30 69 40 63 47 L61 46 C66 38 65 30 62 23 Z" 
        fill="url(#bunny-ear-inner)" 
        filter="url(#bunny-neon-glow)" />

  <!-- Main Cybernetic Face Structure -->
  <polygon points="32,50 68,50 78,66 50,86 22,66" 
           fill="url(#bunny-dark-armor)" 
           stroke="url(#bunny-crimson-grad)" 
           stroke-width="2.5" />

  <!-- Cheek Accents -->
  <line x1="24" y1="62" x2="16" y2="60" stroke="#ff2a55" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="25" y1="67" x2="18" y2="68" stroke="#ff2a55" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="76" y1="62" x2="84" y2="60" stroke="#ff2a55" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="75" y1="67" x2="82" y2="68" stroke="#ff2a55" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Futuristic Cyber Visor / Eyes -->
  <!-- Left Eye Visor -->
  <polygon points="34,60 46,63 44,68 32,65" 
           fill="url(#bunny-crimson-grad)" 
           filter="url(#bunny-neon-glow)" />
  <!-- Right Eye Visor -->
  <polygon points="66,60 54,63 56,68 68,65" 
           fill="url(#bunny-crimson-grad)" 
           filter="url(#bunny-neon-glow)" />

  <!-- Center Nose / Neural Core Node -->
  <polygon points="50,68 46,73 54,73" fill="#ff2a55" filter="url(#bunny-neon-glow)" />
  <circle cx="50" cy="58" r="2.5" fill="#ffffff" filter="url(#bunny-neon-glow)" />

  <!-- Lower Chin Accent Line -->
  <polyline points="42,78 50,82 58,78" stroke="#ff2a55" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
</svg>
